<h1>データベース検索</h1>

<p>種別を選び、条件を追加して実行してください。</p>
<ul>
  <li>例: 種別「楽曲」→ 条件「歌唱アーティスト: 高橋ポルカ」→ 高橋ポルカの楽曲一覧</li>
  <li>例: 種別「人」→ 条件「所属グループ/ユニット: いきづらい部」→ メンバー一覧</li>
</ul>

<label for="type">種別</label>
<select id="type">
  <option value="">選択</option>
  <option value="Person">人 (キャラクター/声優)</option>
  <option value="Music">楽曲 (シングル/アルバム)</option>
  <option value="MusicGroup">グループ/ユニット</option>
  <option value="MusicEvent">ライブイベント</option>
  <option value="TVSeries">メディアミックスプロジェクト</option>
  <option value="Place">場所</option>
  <option value="Organization">組織</option>
  <option value="LocalBusiness">店舗・事業所</option>
  <option value="Thing">物・食品・グッズ</option>
  <option value="CreativeWork">記事・リスト等</option>
  <option value="SoftwareApplication">ソフトウェア</option>
  <option value="Event">非音楽イベント</option>
</select>

<div id="conditions" style="margin-block: 1rem"></div>

<fieldset>
  <legend>条件の組み合わせ</legend>
  <label for="mode-and">
    <input type="radio" id="mode-and" name="mode" value="and" checked>
    AND (すべて満たす)
  </label>
  <label for="mode-or">
    <input type="radio" id="mode-or" name="mode" value="or">
    OR (いずれか満たす)
  </label>
</fieldset>

<button type="button" id="add" disabled>+ 条件を追加</button>
<button type="button" id="run" disabled style="margin-inline-start: 0.5rem">実行</button>

<div id="status" style="margin-block: 0.5rem"></div>
<div id="result"></div>

<details style="margin-block-start: 2rem">
  <summary>SPARQL を直接実行 (開発者向け)</summary>
  <textarea id="sparql" rows="10" style="width:100%;font-family:monospace"></textarea>
  <button type="button" id="direct-run">実行</button>
</details>

<script src="./index.js" type="module"></script>
